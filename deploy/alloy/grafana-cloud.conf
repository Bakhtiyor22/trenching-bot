# systemd drop-in for alloy.service: hands the Grafana Cloud push credentials to Alloy as environment variables.
# Installed as /etc/systemd/system/alloy.service.d/grafana-cloud.conf (deploy/README.md, step 14). The file it names is
# created and filled by the developer on the server, mode 0600 root:root; systemd reads it as root before dropping to
# the alloy user.
[Service]
EnvironmentFile=/etc/alloy/grafana-cloud.env
