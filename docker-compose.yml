services:
  postgres:
    image: postgres:17-alpine
    container_name: trenching-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trenching_bot}
      POSTGRES_USER: ${POSTGRES_USER:-trenching}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trenching}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trenching} -d ${POSTGRES_DB:-trenching_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
