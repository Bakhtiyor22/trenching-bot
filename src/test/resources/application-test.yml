# Integration tests. The datasource comes from the Testcontainers
# @ServiceConnection, so only JPA behaviour and noise levels are set here.
spring:
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.trenching.bot: INFO
