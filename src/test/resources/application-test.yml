# Integration tests. The datasource comes from the Testcontainers
# @ServiceConnection, so only JPA behaviour and noise levels are set here.
spring:
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.trenching.bot: INFO

# The settings read from the environment in every profile are blank here, so a test never reaches Telegram or Helius whatever the
# machine exports. A test that needs one sets it itself.
trenching:
  notification:
    telegram:
      bot-token: ""
      chat-id: ""
  solana:
    backup-rpc-url: ""
    usage:
      primary-project-id: ""
      backup-project-id: ""
