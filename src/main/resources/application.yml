spring:
  application:
    name: trenching-bot
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      # Parse uploads inside the handler so an oversized one reaches the console's error advice.
      resolve-lazily: true

trenching:
  solana:
    # Secret (may embed an API key): environment only; blank means not configured.
    rpc-url: ${SOLANA_RPC_URL:}

# Provider pacing is shared by every capture against the same RPC endpoint in this process. 4 requests in flight with
# a start every 125 ms (8 per second) stays below the 10 requests per second free tier; 1 and 500ms reproduce the old pacing.
marketdata:
  capture:
    max-concurrent-requests: 4
    min-request-interval: 125ms

walletactivity:
  capture:
    max-concurrent-requests: 4
    min-request-interval: 125ms

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
