spring:
  application:
    name: trenching-bot
  task:
    scheduling:
      # One thread: automation's discovery, pipeline, sweep, session ticks and "run now" rely on never running at the same time.
      pool:
        size: 1
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      # Parse uploads inside the handler so an oversized one reaches the console's error advice.
      resolve-lazily: true

trenching:
  solana:
    # Secret (may embed an API key): environment only; blank means not configured.
    rpc-url: ${SOLANA_RPC_URL:}
  console:
    # Public on-chain wallets the new-capture form offers first; a label also names that wallet's generated captures.
    suggested-wallets:
      - label: Decu
        address: 4vw54BmAogeRV3vPKWyFet5yf8DTLcREzdSzx4rw9Ud9
  # Automated discovery, capture and sweep of one wallet's buys (README, Console → Automation). Off unless enabled, and only
  # under the local or prod profile with the console enabled; capture-enabled false is phase 0, discovery only.
  automation:
    enabled: false
    capture-enabled: false
    zone: "+05:00"
    poll-from: "18:00"
    poll-to: "05:00"
    poll-always: false
    trading-day-start: "12:00"
    tick-interval: 1m
    discovery-interval: 10m
    initial-lookback: PT12H
    max-discovery-pages: 5
    session-idle: 60m
    market-delay: 35m
    capture-min-signal-sol: 1.5
    capture-fee-margin-bps: 300
    max-step-attempts: 2
    max-requests-per-24h: 5000
    operation-budget:
      requests: 400
      bytes: 100MB
      timeout: 10m
    recovery:
      requests: 1200
      bytes: 300MB
      attempts: 3
    # A buy whose 30-minute market window lists more trades fails OVER_CAP before any is fetched; at most recovery.requests x max-step-attempts.
    market-max-transactions: 2000
    sweep-plan: decu-sweep-1
    evaluation-window-sessions: 7
    min-signals: 10
    min-net-pnl-sol: 0
    backfill-max-days: 31
    backfill-max-requests: 20000
    backfill-reserve-requests: 1400

# Provider pacing is shared by every capture and discovery against the same RPC endpoint in this process. The Helius free tier
# refused requests at 4 in flight and 8 starts a second (hundreds of 429s a day); 2 in flight and a start every 250 ms
# (4 a second) stays under it. 1 and 500ms reproduce the old fixed pacing.
marketdata:
  capture:
    max-concurrent-requests: 2
    min-request-interval: 250ms
  reference-rates:
    # api.binance.com is unreachable from this network since 2026-11-04; Binance's public market-data mirror serves the same klines and ticker.
    # Inert until marketdata.reference-rates.enabled is true, which only the local and prod profiles set.
    base-url: https://data-api.binance.vision

walletactivity:
  capture:
    max-concurrent-requests: 2
    min-request-interval: 250ms

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Written only where a profile sets logging.file.name; harmless otherwise.
logging:
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 500MB
