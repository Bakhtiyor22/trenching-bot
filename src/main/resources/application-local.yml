# Local development against the PostgreSQL started by docker-compose.yml.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/trenching_bot
    username: trenching
    password: trenching
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

trenching:
  console:
    enabled: true
  # Automation is off here. Live automation settings live in the untracked config/application-local.yml; run at most one
  # automation instance across the PC and the server.

# SOL/USDT rates from Binance's public API (no key): the console's USDT view, and the captures' rates step that the
# strategy's USD market-cap check replays from. The mirror base-url and the Helius pacing are in application.yml.
marketdata:
  reference-rates:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

# Also written to a rolling file: show-sql prints to stdout only, not through the logger, so the file stays free of SQL
# and an INTERNAL_ERROR reply's errorId can still be found after the console has scrolled past it.
logging:
  file:
    name: logs/trenching-bot.log
  level:
    com.trenching.bot: DEBUG
