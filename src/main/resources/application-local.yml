# Local development against the PostgreSQL started by docker-compose.yml.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trenching_bot
    username: trenching
    password: trenching
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.trenching.bot: DEBUG
