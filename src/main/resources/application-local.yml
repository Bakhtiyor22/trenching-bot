# Local development against the PostgreSQL started by docker-compose.yml.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/trenching_bot
    username: trenching
    password: trenching
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

trenching:
  console:
    enabled: true

# Display-only SOL/USDT rates from Binance's public API for the console's USDT view (no key).
marketdata:
  reference-rates:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

# Also written to a rolling file: show-sql prints to stdout only, not through the logger, so the file stays free of SQL
# and an INTERNAL_ERROR reply's errorId can still be found after the console has scrolled past it.
logging:
  file:
    name: logs/trenching-bot.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 500MB
  level:
    com.trenching.bot: DEBUG
